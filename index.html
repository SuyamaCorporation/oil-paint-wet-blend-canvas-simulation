<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>油絵具ウェットブレンド 筆タッチシミュレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  #paintCanvas { cursor: crosshair; touch-action: none; display: block; }
  input[type=range] { accent-color: #d97706; }
  input[type=color] { -webkit-appearance: none; border: none; width: 36px; height: 36px; cursor: pointer; border-radius: 6px; }
</style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-4">
  <h1 class="text-2xl font-bold text-center mb-1 text-amber-300">油絵具ウェットブレンド シミュレーター</h1>
  <p class="text-center text-gray-400 text-sm mb-4">マウス/タッチで描画 — 重なった色は混合される</p>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
    <!-- Left controls -->
    <div class="lg:col-span-1 space-y-3">
      <div class="bg-gray-800 rounded-xl p-4 space-y-3">
        <h2 class="font-semibold text-amber-300 border-b border-gray-700 pb-2">ブラシ設定</h2>

        <div>
          <label class="text-sm text-gray-300 block mb-1">ブラシ種類</label>
          <div class="grid grid-cols-2 gap-1">
            <button class="brush-type-btn active bg-amber-700 text-white text-xs py-1.5 px-2 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" data-type="round_soft" aria-label="丸筆（柔らか）を選択">丸（柔）</button>
            <button class="brush-type-btn bg-gray-600 text-gray-200 text-xs py-1.5 px-2 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" data-type="round_hard" aria-label="丸筆（硬い）を選択">丸（硬）</button>
            <button class="brush-type-btn bg-gray-600 text-gray-200 text-xs py-1.5 px-2 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" data-type="flat" aria-label="フラットブラシを選択">フラット</button>
            <button class="brush-type-btn bg-gray-600 text-gray-200 text-xs py-1.5 px-2 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" data-type="fan" aria-label="扇形ブラシを選択">ファン</button>
            <button class="brush-type-btn bg-gray-600 text-gray-200 text-xs py-1.5 px-2 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" data-type="knife" aria-label="パレットナイフを選択">ナイフ</button>
            <button class="brush-type-btn bg-gray-600 text-gray-200 text-xs py-1.5 px-2 rounded focus:outline-none focus:ring-2 focus:ring-amber-400" data-type="smear" aria-label="スミアツールを選択">スミア</button>
          </div>
        </div>

        <div>
          <label for="brushSize" class="text-sm text-gray-300 flex justify-between">
            <span>サイズ</span><span id="brushSizeVal" class="text-amber-400 font-mono">20</span>
          </label>
          <input type="range" id="brushSize" min="2" max="80" value="20" class="w-full mt-1" aria-label="ブラシサイズ">
        </div>

        <div>
          <label for="brushOpacity" class="text-sm text-gray-300 flex justify-between">
            <span>不透明度</span><span id="brushOpacityVal" class="text-amber-400 font-mono">80%</span>
          </label>
          <input type="range" id="brushOpacity" min="10" max="100" value="80" class="w-full mt-1" aria-label="ブラシ不透明度">
        </div>

        <div>
          <label for="blendStrength" class="text-sm text-gray-300 flex justify-between">
            <span>ブレンド強度</span><span id="blendStrengthVal" class="text-amber-400 font-mono">50%</span>
          </label>
          <input type="range" id="blendStrength" min="0" max="100" value="50" class="w-full mt-1" aria-label="ブレンド強度">
        </div>

        <div class="flex items-center gap-3">
          <label for="colorPicker" class="text-sm text-gray-300">色</label>
          <input type="color" id="colorPicker" value="#c8552a" aria-label="ブラシカラーを選択">
        </div>

        <!-- Color palette -->
        <div>
          <div class="text-sm text-gray-300 mb-1">パレット</div>
          <div class="grid grid-cols-6 gap-1" id="colorPalette" role="group" aria-label="カラーパレット">
          </div>
        </div>
      </div>

      <div class="bg-gray-800 rounded-xl p-4 space-y-2">
        <h2 class="font-semibold text-amber-300 border-b border-gray-700 pb-2">アクション</h2>
        <label class="flex items-center gap-2 cursor-pointer text-sm">
          <input type="checkbox" id="textureToggle" class="accent-amber-500" aria-label="キャンバス質感オーバーレイ"> キャンバス質感
        </label>
        <label class="flex items-center gap-2 cursor-pointer text-sm">
          <input type="checkbox" id="bgLayer" class="accent-amber-500" aria-label="背景レイヤー表示"> 背景レイヤー
        </label>
        <button id="btnUndo" class="w-full bg-gray-600 hover:bg-gray-500 text-white font-semibold py-2 px-3 rounded-lg transition text-sm focus:outline-none focus:ring-2 focus:ring-gray-400" aria-label="元に戻す (Ctrl+Z)">
          元に戻す (Ctrl+Z)
        </button>
        <button id="btnClear" class="w-full bg-red-800 hover:bg-red-700 text-white font-semibold py-2 px-3 rounded-lg transition text-sm focus:outline-none focus:ring-2 focus:ring-red-400" aria-label="キャンバスをクリア">
          クリア
        </button>
        <button id="btnExport" class="w-full bg-gray-600 hover:bg-gray-500 text-white font-semibold py-2 px-3 rounded-lg transition text-sm focus:outline-none focus:ring-2 focus:ring-gray-400" aria-label="PNGとして保存">
          PNG 保存
        </button>
      </div>
    </div>

    <!-- Canvas area -->
    <div class="lg:col-span-3">
      <div class="bg-gray-800 rounded-xl p-3 relative">
        <div id="canvasWrapper" class="relative overflow-hidden rounded-lg" style="background: #1a0f07;">
          <canvas id="bgCanvas" class="absolute top-0 left-0" style="pointer-events:none;"></canvas>
          <canvas id="paintCanvas" role="img" aria-label="油絵具シミュレーションキャンバス"></canvas>
          <canvas id="textureCanvas" class="absolute top-0 left-0" style="pointer-events:none; opacity:0; mix-blend-mode:multiply;"></canvas>
        </div>
        <div class="mt-2 flex justify-between text-xs text-gray-500">
          <span>現在のツール: <span id="currentTool" class="text-amber-400">丸筆（柔らか）</span></span>
          <span>Ctrl+Z: 元に戻す</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const paintCanvas = document.getElementById('paintCanvas');
const pCtx = paintCanvas.getContext('2d');
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const textureCanvas = document.getElementById('textureCanvas');
const tCtx = textureCanvas.getContext('2d');

let W = 0, H = 0;
let brushType = 'round_soft';
let brushSize = 20;
let brushOpacity = 0.80;
let blendStrength = 0.5;
let currentColor = '#c8552a';
let isDrawing = false;
let lastX = -1, lastY = -1;
let showTexture = false;
let showBg = false;
let undoStack = [];
const MAX_UNDO = 10;

const PALETTE_COLORS = [
  '#1a1a1a','#ffffff','#ff2200','#ff7700','#ffee00',
  '#00aa44','#0044ff','#8800cc','#c8552a','#f4a460',
  '#8b4513','#2f4f2f','#1e3a5f','#8b0000','#ffd700'
];

function setupSizes() {
  const wrapper = document.getElementById('canvasWrapper');
  W = wrapper.clientWidth;
  H = Math.max(400, Math.round(W * 0.6));
  [paintCanvas, bgCanvas, textureCanvas].forEach(c => {
    c.width = W; c.height = H;
  });
  wrapper.style.height = H + 'px';
  drawBg();
  generateTexture();
}

function drawBg() {
  bgCtx.fillStyle = '#1a0f07';
  bgCtx.fillRect(0, 0, W, H);
  if (showBg) {
    // Simple wood-grain-like background
    for (let y = 0; y < H; y += 3) {
      const hue = 25 + Math.sin(y * 0.03) * 5;
      bgCtx.fillStyle = `hsl(${hue},40%,${12 + Math.sin(y*0.07)*3}%)`;
      bgCtx.fillRect(0, y, W, 3);
    }
  }
}

function generateTexture() {
  const imgData = tCtx.createImageData(W, H);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 60;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 60;
  }
  tCtx.putImageData(imgData, 0, 0);
  textureCanvas.style.opacity = showTexture ? '0.3' : '0';
}

// Undo
function pushUndo() {
  if (undoStack.length >= MAX_UNDO) undoStack.shift();
  undoStack.push(pCtx.getImageData(0, 0, W, H));
}

function undo() {
  if (undoStack.length === 0) return;
  pCtx.putImageData(undoStack.pop(), 0, 0);
}

// Color parsing
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b];
}

// Brush rendering
function getBrushShape(type, size) {
  // Returns array of {dx, dy, weight}
  const pts = [];
  if (type === 'round_soft') {
    for (let dy = -size; dy <= size; dy++) {
      for (let dx = -size; dx <= size; dx++) {
        const d = Math.sqrt(dx*dx+dy*dy);
        if (d <= size) {
          const w = Math.pow(1 - d/size, 2); // soft falloff
          pts.push({dx,dy,w});
        }
      }
    }
  } else if (type === 'round_hard') {
    for (let dy = -size; dy <= size; dy++) {
      for (let dx = -size; dx <= size; dx++) {
        const d = Math.sqrt(dx*dx+dy*dy);
        if (d <= size) {
          pts.push({dx,dy,w:1});
        }
      }
    }
  } else if (type === 'flat') {
    for (let dy = -Math.round(size*0.3); dy <= Math.round(size*0.3); dy++) {
      for (let dx = -size; dx <= size; dx++) {
        pts.push({dx,dy,w:0.9});
      }
    }
  } else if (type === 'fan') {
    for (let dy = -size; dy <= size; dy++) {
      for (let dx = -size; dx <= size; dx++) {
        const d = Math.sqrt(dx*dx+dy*dy);
        if (d <= size) {
          const angle = Math.atan2(dy, dx);
          const fanW = (Math.abs(Math.sin(angle * 4)) > 0.3) ? 0.9 : 0.1;
          pts.push({dx,dy,w: fanW * (1 - d/size * 0.5)});
        }
      }
    }
  } else if (type === 'knife') {
    const h2 = Math.max(2, Math.round(size*0.15));
    for (let dy = -h2; dy <= h2; dy++) {
      for (let dx = -size; dx <= size; dx++) {
        const e = Math.abs(dx)/size;
        pts.push({dx,dy,w: 0.95 - e*0.3});
      }
    }
  }
  return pts;
}

function applyBrushStroke(x, y, type, size, r, g, b, opacity, blend) {
  if (type === 'smear') {
    applySmear(x, y, size);
    return;
  }
  const pts = getBrushShape(type, size);
  if (pts.length === 0) return;

  const imgData = pCtx.getImageData(
    Math.max(0, x - size - 2), Math.max(0, y - size - 2),
    Math.min(W, x + size + 2) - Math.max(0, x - size - 2),
    Math.min(H, y + size + 2) - Math.max(0, y - size - 2)
  );
  const d = imgData.data;
  const ox = Math.max(0, x - size - 2);
  const oy = Math.max(0, y - size - 2);
  const iw = imgData.width;

  for (const pt of pts) {
    const px = Math.round(x + pt.dx) - ox;
    const py = Math.round(y + pt.dy) - oy;
    if (px < 0 || py < 0 || px >= iw || py >= imgData.height) continue;
    const idx = (py * iw + px) * 4;
    const alpha = pt.w * opacity;

    // Wet blend: mix with existing color
    const existR = d[idx], existG = d[idx+1], existB = d[idx+2];
    const existA = d[idx+3] / 255;

    // Blending: mix new color with existing
    const blendFactor = existA > 0 ? blend : 0;
    const newR = r * (1 - blendFactor) + existR * blendFactor;
    const newG = g * (1 - blendFactor) + existG * blendFactor;
    const newB = b * (1 - blendFactor) + existB * blendFactor;

    d[idx]   = Math.round(newR * alpha + existR * (1 - alpha));
    d[idx+1] = Math.round(newG * alpha + existG * (1 - alpha));
    d[idx+2] = Math.round(newB * alpha + existB * (1 - alpha));
    d[idx+3] = Math.min(255, Math.round(d[idx+3] + alpha * 255));
  }
  pCtx.putImageData(imgData, ox, oy);
}

function applySmear(x, y, size) {
  // Displace nearby pixels radially
  const imgData = pCtx.getImageData(
    Math.max(0, x - size - 2), Math.max(0, y - size - 2),
    Math.min(W, x + size + 2) - Math.max(0, x - size - 2),
    Math.min(H, y + size + 2) - Math.max(0, y - size - 2)
  );
  const d = imgData.data;
  const ox = Math.max(0, x - size - 2);
  const oy = Math.max(0, y - size - 2);
  const iw = imgData.width;
  const ih = imgData.height;
  const copy = new Uint8ClampedArray(d);

  for (let py = 0; py < ih; py++) {
    for (let px = 0; px < iw; px++) {
      const wx = px + ox - x, wy = py + oy - y;
      const dist = Math.sqrt(wx*wx + wy*wy);
      if (dist > size) continue;
      const factor = (1 - dist/size) * 0.4;
      // Sample from slightly offset position (smear direction from last pos)
      const dx2 = lastX === -1 ? 0 : (x - lastX) * factor;
      const dy2 = lastY === -1 ? 0 : (y - lastY) * factor;
      const sx = Math.round(px - dx2);
      const sy = Math.round(py - dy2);
      if (sx >= 0 && sy >= 0 && sx < iw && sy < ih) {
        const srcIdx = (sy * iw + sx) * 4;
        const dstIdx = (py * iw + px) * 4;
        d[dstIdx]   = copy[srcIdx];
        d[dstIdx+1] = copy[srcIdx+1];
        d[dstIdx+2] = copy[srcIdx+2];
        d[dstIdx+3] = copy[srcIdx+3];
      }
    }
  }
  pCtx.putImageData(imgData, ox, oy);
}

function interpolateDraw(x0, y0, x1, y1) {
  const dist = Math.hypot(x1-x0, y1-y0);
  const steps = Math.max(1, Math.ceil(dist / (brushSize * 0.25)));
  const [r, g, b] = hexToRgb(currentColor);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const ix = x0 + (x1-x0)*t;
    const iy = y0 + (y1-y0)*t;
    applyBrushStroke(ix, iy, brushType, brushSize, r, g, b, brushOpacity, blendStrength);
  }
}

function getPos(e) {
  const rect = paintCanvas.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  if (e.touches) return {x:(e.touches[0].clientX-rect.left)*scaleX, y:(e.touches[0].clientY-rect.top)*scaleY};
  return {x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY};
}

paintCanvas.addEventListener('mousedown', e => {
  e.preventDefault();
  pushUndo();
  isDrawing = true;
  const pos = getPos(e);
  lastX = pos.x; lastY = pos.y;
  const [r, g, b] = hexToRgb(currentColor);
  applyBrushStroke(pos.x, pos.y, brushType, brushSize, r, g, b, brushOpacity, blendStrength);
});

paintCanvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const pos = getPos(e);
  interpolateDraw(lastX, lastY, pos.x, pos.y);
  lastX = pos.x; lastY = pos.y;
});

paintCanvas.addEventListener('mouseup', () => { isDrawing = false; lastX=-1; lastY=-1; });
paintCanvas.addEventListener('mouseleave', () => { isDrawing = false; lastX=-1; lastY=-1; });

paintCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  pushUndo();
  isDrawing = true;
  const pos = getPos(e);
  lastX = pos.x; lastY = pos.y;
  const [r, g, b] = hexToRgb(currentColor);
  applyBrushStroke(pos.x, pos.y, brushType, brushSize, r, g, b, brushOpacity, blendStrength);
}, {passive:false});

paintCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDrawing) return;
  const pos = getPos(e);
  interpolateDraw(lastX, lastY, pos.x, pos.y);
  lastX = pos.x; lastY = pos.y;
}, {passive:false});

paintCanvas.addEventListener('touchend', () => { isDrawing = false; lastX=-1; lastY=-1; });

// Controls
document.getElementById('brushSize').addEventListener('input', e => {
  brushSize = parseInt(e.target.value);
  document.getElementById('brushSizeVal').textContent = brushSize;
});
document.getElementById('brushOpacity').addEventListener('input', e => {
  brushOpacity = parseInt(e.target.value) / 100;
  document.getElementById('brushOpacityVal').textContent = e.target.value + '%';
});
document.getElementById('blendStrength').addEventListener('input', e => {
  blendStrength = parseInt(e.target.value) / 100;
  document.getElementById('blendStrengthVal').textContent = e.target.value + '%';
});
document.getElementById('colorPicker').addEventListener('input', e => {
  currentColor = e.target.value;
});

const toolNames = {round_soft:'丸筆（柔らか）',round_hard:'丸筆（硬い）',flat:'フラット',fan:'ファン',knife:'パレットナイフ',smear:'スミア'};
document.querySelectorAll('.brush-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.brush-type-btn').forEach(b => {
      b.classList.remove('active', 'bg-amber-700');
      b.classList.add('bg-gray-600');
    });
    btn.classList.add('active', 'bg-amber-700');
    btn.classList.remove('bg-gray-600');
    brushType = btn.dataset.type;
    document.getElementById('currentTool').textContent = toolNames[brushType];
  });
});

document.getElementById('textureToggle').addEventListener('change', e => {
  showTexture = e.target.checked;
  textureCanvas.style.opacity = showTexture ? '0.3' : '0';
});

document.getElementById('bgLayer').addEventListener('change', e => {
  showBg = e.target.checked;
  drawBg();
});

document.getElementById('btnUndo').addEventListener('click', undo);
document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key==='z') { e.preventDefault(); undo(); } });

document.getElementById('btnClear').addEventListener('click', () => {
  pushUndo();
  pCtx.clearRect(0, 0, W, H);
});

document.getElementById('btnExport').addEventListener('click', () => {
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = W; exportCanvas.height = H;
  const ectx = exportCanvas.getContext('2d');
  ectx.drawImage(bgCanvas, 0, 0);
  ectx.drawImage(paintCanvas, 0, 0);
  if (showTexture) {
    ectx.globalAlpha = 0.3;
    ectx.drawImage(textureCanvas, 0, 0);
    ectx.globalAlpha = 1;
  }
  const link = document.createElement('a');
  link.download = 'oil_painting.png';
  link.href = exportCanvas.toDataURL('image/png');
  link.click();
});

// Palette
const paletteEl = document.getElementById('colorPalette');
PALETTE_COLORS.forEach(c => {
  const btn = document.createElement('button');
  btn.style.background = c;
  btn.style.width = '24px';
  btn.style.height = '24px';
  btn.style.borderRadius = '4px';
  btn.style.border = '1px solid rgba(255,255,255,0.2)';
  btn.style.cursor = 'pointer';
  btn.setAttribute('aria-label', `色 ${c} を選択`);
  btn.addEventListener('click', () => {
    currentColor = c;
    document.getElementById('colorPicker').value = c;
  });
  paletteEl.appendChild(btn);
});

// Init
window.addEventListener('resize', () => { setupSizes(); });
setupSizes();
</script>
</body>
</html>
